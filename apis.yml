- aid: tooloracle-io:oraclenet-a2a-agent
  name: OracleNet A2A Agent
  description: >-
    A2A 0.3 JSON-RPC agent at https://tooloracle.io/a2a/jsonrpc (message/send, tasks/*, push-notification
    configs, authenticated extended card) fronting ten category-level skills that route to the MCP mesh,
    described by a conformant Agent Card served at both /.well-known/agent-card.json and the legacy /.well-known/agent.json;
    a second card for the FeedOracle brand points at the same endpoint.
