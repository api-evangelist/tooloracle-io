- aid: tooloracle-io:oraclenet-mcp-servers
  name: OracleNet MCP Servers
  description: >-
    The hosted MCP mesh: ninety-two endpoints under tooloracle.io (plus five on feedoracle.io / mcp.feedoracle.io) answered an anonymous
    tools/list on 2026-09-19/20 with 1,178 tool entries and 919 unique tool names, all over Streamable HTTP at MCP protocol 2025-03-26.
    The main endpoint https://tooloracle.io/mcp/ identifies as RankOracle (13 SEO tools); the mesh front door is https://tooloracle.io/quantum/mcp/
    (join, route, trust passport, execute). Free tools need no credential; paid tools answer 402 with an x402 challenge; sixty-one
    io.tooloracle/* servers are listed in the official MCP registry.
  humanURL: https://tooloracle.io/docs/mcp-auth.html
