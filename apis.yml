aid: tooloracle-io
name: FeedOracle Technologies
description: >-
  FeedOracle Technologies (Herford, Germany) operates two agent-facing brands on one shared OAuth 2.1 identity layer. ToolOracle / OracleNet at tooloracle.io is a capability router and hosted mesh of about ninety Model Context Protocol servers for autonomous agents (1,178 tool entries across blockchain intelligence, EU regulatory compliance, finance, business intelligence, travel and agent trust), reachable over MCP Streamable HTTP, an A2A 0.3 agent with a published Agent Card, a free ANP soft-handshake router, and x402 v2 pay-per-call settlement in USDC on Base for eighteen priced /v2 compliance and agent-safety REST routes. FeedOracle at feedoracle.io is the sibling compliance-evidence API (227-path OpenAPI 3.1 at api.feedoracle.io, ES256K-signed responses) and hosts the RFC 8414 / RFC 7591 authorization server both brands use.
image: https://tooloracle.io/favicon.ico
url: https://raw.githubusercontent.com/api-evangelist/tooloracle-io/refs/heads/main/apis.yml
x-type: company
x-source: harvest:a2a-registry
x-tier: profiled
x-tier-reason: full enrichment pass local-v3 on 2026-09-19 (was a harvest stub)
specificationVersion: '0.20'
created: '2026-09-19'
modified: '2026-09-19'
tags:
- Company
- MCP
- Agent Infrastructure
- A2A
- x402
- Micropayments
- Compliance
- RegTech
- Blockchain
- Sanctions Screening
- Agent Discovery
- Germany
apis:
- aid: tooloracle-io:oraclenet-mcp-servers
  name: OracleNet MCP Servers
  description: >-
    The hosted MCP mesh: ninety-two endpoints under tooloracle.io (plus five on feedoracle.io / mcp.feedoracle.io)
    answered an anonymous tools/list on 2026-09-19/20 with 1,178 tool entries and 919 unique tool names,
    all over Streamable HTTP at MCP protocol 2025-03-26. The main endpoint https://tooloracle.io/mcp/
    identifies as RankOracle (13 SEO tools); the mesh front door is https://tooloracle.io/quantum/mcp/
    (join, route, trust passport, execute). Free tools need no credential; paid tools answer 402 with
    an x402 challenge; sixty-one io.tooloracle/* servers are listed in the official MCP registry.
  humanURL: https://tooloracle.io/docs/mcp-auth.html
  baseURL: https://tooloracle.io/mcp/
