- aid: tooloracle-io:tooloracle-x402-v2-api
  name: ToolOracle x402 v2 Compliance, Evidence & Agent-Safety API
  description: >-
    Account-less pay-per-call REST API (OpenAPI 3.1.0 with schemas and examples on every operation): agent action preflight,
    MiCA stablecoin compliance, AML/sanctions screening, CVE lookup, UVO claim and citation verification, and a US macro snapshot.
    Every route follows x402 v2 — an unpaid POST returns HTTP 402 with a PAYMENT-REQUIRED challenge (USDC on Base, EIP-3009 exact
    scheme, CDP facilitator); retry with PAYMENT-SIGNATURE; paid responses carry an Ed25519-signed execution receipt.
  humanURL: https://tooloracle.io/docs/x402-buyer-quickstart/
