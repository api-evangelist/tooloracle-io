summary: >-
  Limits are published as daily call quotas per access tier, in three documents that do not fully agree, and are enforced at the
  nginx edge without any runtime header. The RFC 9728 protected-resource document is the most machine-readable statement
  (anonymous 20/day, free 200/day, paid unlimited on tooloracle.io). pricing.json says the discovery tier's limit is
  "route-specific; may be published in endpoint headers" — none were, on any captured response.
