observed:
  note: >-
    Running ~6 concurrent tools/list requests across different endpoints produced 429s on four endpoints (/deal/mcp/, /x402/smart/mcp/,
    /nis2/mcp/, /aiact/mcp/) within seconds; sequential requests spaced 1.2 s apart never hit 429 across ~90 endpoints. The edge limit
    therefore appears to be per-source concurrency/rate rather than the per-tier daily quota, and it is invisible until it fires.
