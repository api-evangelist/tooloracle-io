surface_relationship:
  note: >-
    The A2A card is the broadest of ToolOracle's three agent surfaces in scope and the thinnest in contract: ten
    category-level skills that route to ~90 MCP servers (mcp/tooloracle-io-mcp.yml, 1,178 tool entries with real
    inputSchemas) and to 18 priced /v2 REST routes (openapi/tooloracle-io-x402-v2-openapi.yml). An agent that reads only
    the card sees the categories and the payment terms; the callable contracts live in MCP and the x402 manifest.
