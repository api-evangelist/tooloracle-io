generated: '2026-09-19'
method: derived
source: >-
  Derived from openapi/_original/tooloracle-io-v2-openapi.json (18 schemas: eight Input/Output pairs plus X402PaymentRequired and Error),
  the mesh-economics request bodies in openapi/_original/tooloracle-io-openapi.json (wallet, agent_id, referrer_wallet, call_uuid,
  decision), the tool inputSchemas in mcp/tooloracle-io-tools.json (kya_register, quantum_join, quantum_deal, escrow_*), the A2A card
  and https://tooloracle.io/assets/catalog.json. There is no object reference page; id prefixes are the ones observed in live responses.
docs: https://tooloracle.io/docs/
notation: relationships use has_one / has_many / belongs_to with the referencing field name; direction is from the entity that owns the reference.
entities:
- name: 'Oracle'
  domain: 'catalog'
  description: 'One hosted MCP server (e.g. XRPLOracle) with a DID (did:web:tooloracle.io:<oracle>), endpoint(s), category, tool count and online status. Source: assets/catalog.json, mesh/registry.json, agent-pulse.'
- name: 'Tool'
  domain: 'catalog'
  description: 'An MCP tool with name, description and inputSchema, returned by tools/list on an Oracle endpoint.'
- name: 'Category'
  domain: 'catalog'
  description: 'One of 8 catalog categories (compliance, blockchain, business, finance, trust, travel, payments, compute) mirrored by the A2A skills.'
- name: 'Skill'
  domain: 'a2a'
  description: 'One of the 10 A2A card skills routing to a category of Oracles; nomos_preflight additionally binds to a priced route.'
- name: 'Product (x402 route)'
  domain: 'payments'
  description: 'A priced POST route (/v2/* or /x402/{product}/mcp/) with price, network, asset, payTo, inputSchema, example_type. Source: /.well-known/x402.'
- name: 'PaymentChallenge'
  domain: 'payments'
  description: 'The 402 accepts[] block (scheme, network, amount, asset, payTo, maxTimeoutSeconds); the authoritative price. Schema X402PaymentRequired.'
- name: 'Wallet'
  domain: 'payments'
  description: 'A Base address holding USDC and credited units; balance via GET /x402/balance/{wallet_address}.'
- name: 'Agent'
  id_prefix: 'client_id / did:wba:'
  domain: 'identity'
  description: "A registered caller (kya_register -> client_id + api_key fo_\u2026 + units) or a DID:WBA identity; carries a trust level 0-3 and a reputation score."
- name: 'TrustPassport'
  id_prefix: 'pass_'
  domain: 'identity'
  description: 'Signed portable trust document (quantum_trust_passport, NOMOS passport link in the card).'
- name: 'CallDecision'
  id_prefix: 'call_uuid'
  domain: 'economics'
  description: 'Pricing decision from POST /economics/api/price (fresh vs cached); committed by POST /economics/api/commit.'
- name: 'LedgerEvent'
  domain: 'economics'
  description: 'Append-only ledger entry written by commit (debit, treasury fee, originator/referrer reward).'
- name: 'Referral'
  domain: 'economics'
  description: 'A 1-hop referral registered via POST /economics/api/referral.'
- name: 'Deal / Escrow'
  domain: 'commerce'
  description: 'Agent-to-agent deal (quantum_deal, escrow_create/escrow_settle on DealOracle) settled in USDC on Base; DealOracle is credential-gated.'
- name: 'Task'
  id_prefix: 'task_'
  domain: 'a2a'
  description: 'A2A task created by message/send; states via tasks/get; push notification configs attach to it.'
- name: 'Subscription'
  domain: 'events'
  description: 'Webhook subscription created by quantum_subscribe or EventFabric subscribe.'
- name: 'Verdict'
  domain: 'compliance'
  description: 'Output of the /v2 routes and preflight tools (GO/CAUTION/STOP, PASS/WARN/BLOCK, APPROVE/WARN/ESCALATE/BLOCK, hit/no-hit) with confidence and evidence.'
- name: 'ExecutionReceipt'
  domain: 'evidence'
  description: 'Ed25519-signed receipt embedded in paid /v2 responses (chain.receipt.document.receipt, verification recipe, JWKS kid).'
- name: 'Memory'
  domain: 'agent-state'
  description: 'Namespace-isolated facts stored by MemoryOracle with optional expires_hours; exportable (Art. 20) and deletable (Art. 17).'
