summary:
  hosts_probed: 6
  paths_probed: 132
  documents_served: 33
  note: 'ToolOracle serves an unusually complete discovery surface on tooloracle.io: RFC 9116 security.txt, RFC
    8414 authorization-server metadata (delegated to feedoracle.io), RFC 9728 protected-resource metadata, an RFC
    9727 API catalog linkset, an ai-plugin.json, an A2A Agent Card at both the canonical and legacy paths, an MCP
    server card, an x402 v2 manifest, a JWKS, a DID document and ANP agent descriptions. OpenID Connect discovery
    lives ONLY on the auth-server host feedoracle.io. Neither api.feedoracle.io (the REST base) nor mcp.feedoracle.io
    (the MCP SSE host) serves protected-resource or authorization-server metadata — the RFC 9728 document for the
    FeedOracle resource sits on feedoracle.io. No UCP/ACP/AAuth/APIs.json document on any host.'
  misses_that_matter:
  - /.well-known/openid-configuration on tooloracle.io (404) — discovery is on feedoracle.io
  - /.well-known/oauth-protected-resource on api.feedoracle.io and mcp.feedoracle.io (404) — an MCP client that
    follows RFC 9728 from the SSE host finds nothing
  - /.well-known/apis.json, /apis.json, /apis.yml on every host (404)
  - /.well-known/ucp.json, /.well-known/acp.json, /.well-known/aauth-resource.json on every host (404)
