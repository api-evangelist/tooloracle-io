components:
  schemas:
    agentPreflightInput:
      type: object
      properties:
        intent:
          type: string
          description: Description of what the agent wants to do.
        context:
          type: object
          description: Optional agent context (agent_id, session_id, etc.).
          additionalProperties: true
      required:
      - intent
      additionalProperties: false
    agentPreflightOutput:
      type: object
      properties:
        verdict:
          type: string
        cost_units:
          type: integer
        evidence:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
    micaStablecoinCheckInput:
      type: object
      properties:
        token:
          type: string
          description: Stablecoin symbol (USDC, USDT, EURC, RLUSD, DAI, etc.).
        issuer:
          type: string
          description: Optional issuer name (Circle, Tether, Ripple, etc.).
      required:
      - token
      additionalProperties: false
    micaStablecoinCheckOutput:
      type: object
      properties:
        verdict:
          type: string
        score:
          type: number
        grade:
          type: string
        mica_status:
          type: string
        signed:
          type: boolean
    uvoQuickInput:
      type: object
      properties:
        proposal:
          type: object
          description: Agent action proposal to validate.
          properties:
            action_type:
              type: string
              description: Kind of action (e.g. tool_call, payment, publish, deploy).
            target:
              type: string
              description: Target of the action.
            claim:
              type: string
              description: Claim/justification the agent asserts.
            expected_outcome:
              type: string
              description: Expected result if executed.
            success_metric:
              type: string
              description: How success is measured.
            args:
              type: object
              description: Action arguments.
              additionalProperties: true
            idempotent:
              type: boolean
              description: Whether the action is safely repeatable.
            declared_sandbox:
              type: boolean
              description: Whether the action runs in a sandbox.
          additionalProperties: true
      required:
      - proposal
      additionalProperties: false
    uvoQuickOutput:
      type: object
      properties:
        decision:
          type: string
        risk_score:
          type: number
        blocking_layer:
          type: string
        reasoning:
          type: string
        elapsed_ms:
          type: integer
        receipt_id:
          type: string
    uvoCitationCheckInput:
      type: object
      properties:
        claim:
          type: string
          description: Text potentially containing citations to verify.
        references:
          type: array
          description: Optional list of reference URLs/IDs.
          items:
            type: string
      required:
      - claim
      additionalProperties: false
    uvoCitationCheckOutput:
      type: object
      properties:
        verdict:
          type: string
        score:
          type: number
        reasoning:
          type: string
        elapsed_ms:
          type: integer
    uvoFullInput:
      type: object
      properties:
        proposal:
          type: object
          description: Agent action proposal to validate.
          properties:
            action_type:
              type: string
              description: Kind of action (e.g. tool_call, payment, publish, deploy).
            target:
              type: string
              description: Target of the action.
            claim:
              type: string
              description: Claim/justification the agent asserts.
            expected_outcome:
              type: string
              description: Expected result if executed.
            success_metric:
              type: string
              description: How success is measured.
            args:
              type: object
              description: Action arguments.
              additionalProperties: true
            idempotent:
              type: boolean
              description: Whether the action is safely repeatable.
            declared_sandbox:
              type: boolean
              description: Whether the action runs in a sandbox.
          additionalProperties: true
      required:
      - proposal
      additionalProperties: false
    uvoFullOutput:
      type: object
      properties:
        decision:
          type: string
        risk_score:
          type: number
        elapsed_ms:
          type: integer
    sanctionsScreenInput:
      type: object
      properties:
        name:
          type: string
          description: Person or entity name to screen.
        country:
          type: string
          description: Optional ISO country code.
        dob:
          type: string
          description: Optional date of birth YYYY-MM-DD.
      required:
      - name
      additionalProperties: false
    sanctionsScreenOutput:
      type: object
      properties:
        hit:
          type: boolean
        matched_lists:
          type: array
          items: {}
        confidence:
          type: number
    cveLookupInput:
      type: object
      properties:
        keyword:
          type: string
          description: Search keyword, vendor, or product name.
        limit:
          type: integer
          description: Max results (default 10, max 50).
          minimum: 1
          maximum: 50
      required:
      - keyword
      additionalProperties: false
    cveLookupOutput:
      type: object
      properties:
        total_results:
          type: integer
        returned:
          type: integer
        vulnerabilities:
          type: array
