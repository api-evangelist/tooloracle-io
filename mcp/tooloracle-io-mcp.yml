generated: '2026-09-19'
method: probed
status: published
source: https://tooloracle.io/.well-known/mcp.json, https://tooloracle.io/docs/mcp-auth.html, https://tooloracle.io/docs/402-protocol,
  https://registry.modelcontextprotocol.io/v0/servers?search=tooloracle, and a live POST tools/list against every
  advertised endpoint (2026-09-19/20)
docs: https://tooloracle.io/docs/mcp-auth.html
summary: 'ToolOracle / OracleNet is not one MCP server but a hosted mesh: 92 distinct endpoints under tooloracle.io
  (plus five on feedoracle.io / mcp.feedoracle.io) answered an anonymous tools/list with 1178 tool entries (919
  unique tool names; health_check/ping recur on most servers). Every endpoint is MCP over Streamable HTTP (initialize
  reports protocolVersion 2025-03-26). Free tools run with no credential; paid tools return HTTP 402 with an x402
  challenge; an API key (kya_register) or an OAuth 2.1 bearer from feedoracle.io lifts anonymous daily limits. The
  provider registers 61 io.tooloracle/* servers in the official MCP registry.'
deployment:
  mode: remote
  endpoint: https://tooloracle.io/mcp/
  install: null
  package: null
  auth: none
  verified: probed
  note: https://tooloracle.io/mcp/ is the endpoint mcp.json and the docs call "main" and the one `claude mcp add
    --transport http tooloracle https://tooloracle.io/mcp/` connects to; live it identifies itself as RankOracle
    1.2.0 (13 SEO tools), while the mesh front door — routing, join, trust passport, execute — is https://tooloracle.io/quantum/mcp/
    (20 tools). auth is none because anonymous tools/list and free tool calls succeed with no credential; api-key
    (X-API-Key from kya_register), OAuth 2.1 bearer (feedoracle.io, DCR) and x402 payment are optional layers for
    limits and paid tools. No stdio package exists; the GitHub READMEs show `npx -y mcp-remote <url>`, which is
    a third-party bridge to the same remote endpoint, not a local server.
entry_points:
  main: https://tooloracle.io/mcp/
  mesh_front_door: https://tooloracle.io/quantum/mcp/
  preflight: https://tooloracle.io/preflight/mcp/
  verify: https://tooloracle.io/trust/mcp/
  handshake_http: POST https://tooloracle.io/handshake (free, ANP JSON-LD routing recommendation)
protocol:
  transport: streamable-http
  protocol_version_observed: '2025-03-26'
  capabilities_observed:
    tools: true
    resources: false
    prompts: false
  session: stateless on most servers; uvo/mcp is stateful (Mcp-Session-Id)
authentication:
  anonymous: 20 requests/day per RFC 9728 doc; docs/mcp-auth says free tools 100 calls/day
  api_key: X-API-Key issued by the kya_register tool (feedoracle.io/mcp), key prefix fo_
  oauth: OAuth 2.1 bearer from https://feedoracle.io (RFC 8414 metadata on both hosts, RFC 7591 dynamic client registration,
    PKCE S256, client_credentials)
  x402: 'pay-per-call: HTTP 402 + PAYMENT-REQUIRED header on /v2 routes (x402 v2, PAYMENT-SIGNATURE); legacy X-PAYMENT
    tx-hash header on /x402/{product}/mcp/ routes'
  detail: authentication/tooloracle-io-authentication.yml
tool_schemas:
  file: mcp/tooloracle-io-tools.json
  note: verbatim name/description/inputSchema for every tool returned by tools/list, grouped by endpoint
registry:
