method: derived
source: Derived by aligning the live tools/list of every hosted MCP endpoint (mcp/tooloracle-io-tools.json, 2026-09-19/20)
  with the two ToolOracle OpenAPIs (openapi/_original/tooloracle-io-openapi.json, 70 operations; openapi/_original/tooloracle-io-v2-openapi.json,
  8 operations). Confidence per row; nothing mapped that does not exist on both sides.
purpose: 'ToolOracle inverts the usual shape: MCP is the primary contract (1,178 tool entries) and REST is a thin
  projection (18 /v2 x402 routes + mesh-economics + discovery), while 40 of the 70 "REST" operations are just the
  MCP transport endpoints themselves. The crosswalk records which /v2 REST routes have an MCP twin, which MCP servers
  back the OpenAPI''s endpoint operations, and how much of the tool surface has no REST contract at all.'
surfaces:
  rest_openapi:
  - openapi/tooloracle-io-mcp-platform-openapi.yml
  - openapi/tooloracle-io-x402-v2-openapi.yml
  graphql: null
  mcp: https://tooloracle.io/quantum/mcp/ (front door) + ~90 sibling endpoints; tools/list anonymous on all but
    uvo (session) and deal (401)
  manifest: mcp/tooloracle-io-mcp.yml
